<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCSS3 Seçici & Değişkenler</title>

    <style>
        /*1.Global CSS değişkenleri*/
        /*Değişkenler -- ile başlar*/
        /*root tüm sitede  çalışıcak değişkenler demek*/
        /*Puan yükseldikçe baskınlaşıyor sistem yavaşlıyor düşük puan daha iyi perf*/
        /*başına hiç bir şey koymazsak o yapının tamamını etkiler "." koyarsak class bazlı. "#" koyarsak id bazlı*/
        :root{
            --brand-primary: #4f46e5;
            --brand-accent: #06b6d4;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --radius-md: 12px;
        }

        /*Dark mode hazırlığı*/
        /*Normalde yukarıdaki çalışıcak dark modde bg-surface ve text-main için bu kod çalışıcak
        @media (prefers-color-scheme: dark){
            :root{
                --bg-surface: #1e293b;
                --text-main: #f8fafc;

            }
        }
        */

        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 
            'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 
            'Open Sans', 'Helvetica Neue', sans-serif;

            background: #f1f5f9;
            color: var(--text-main);
            padding: 24px;
        }

        /* Puan(0,0,0,1) = 1 */
        button{
            background-color: gray;
            color: white;
            padding: 12px 24 px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            cursor: pointer;
        }

        /* Puan (0,0,1,0) = 10 -> Gray'i ezer o yüzden puanı daha düşüktür*/
        .btn-action{
            background-color: var(--brand-primary);
        }

        /* Puan (0,0,1,1) -> btn-action ezer puan daha da düştü*/
        button.btn-action{
            box-shadow: 0 4px 14px rgba(79,70,229,0.4);
        }

        /* id bazlı css (#kullanılır) Puan (0,1,0,0) -> yukarıda girilen tüm butoları ezdi */
        #submit-btn{
            background: linear-gradient(135deg, var(--brand-primary),var(--brand-accent));
        }

        .btn-action:hover{
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-action:active{
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <h2>CSS Değişkenler</h2>
    <button id="submit-btn" class="btn-action">İşlemi Onayla</button>
    
</body>
</html>
