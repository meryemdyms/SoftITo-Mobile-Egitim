        //isim açıklama kategori fiyat stok etiket
        const kozmetikUrunleriniGetir = async()=>{
            try{
                console.log("Harici Apiye Bağlaılıyor");
                const response = await fetch("https://dummyjson.com/products");

                if(!response.ok){
                    throw new Error(`Http Hatası: ${response.status}`);
                }

                const data = await response.json();
                const vitrin = data.products.slice(2,7).map(p=>({
                    urun:p.title,
                    aciklama:p.description,
                    kategori:p.category,
                    fiyat:p.price,
                    stok:p.stock,
                    etiket:p.tags.join(",")
                }));
                console.table(vitrin);
            }catch(err){
                console.warn("Api Hatası",err.message);

            }
        }

        kozmetikUrunleriniGetir();
