<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İframe</title>
    <!-- Dışarıdaki siteyi sayfamızda açmamızı sağlar-->
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background: khaki;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        .card{
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 52px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h3{
            margin-top: 0;
            color: #1e293b;
        }
        iframe{
            width: 100%;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="card"> 
        <h3>İframe Harita ve video</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/VNgXLlnOaQE?si=cFsiOGIC93gfrDau"
         title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; 
         clipboard-write; encrypted-media; gyroscope; picture-in-picture; 
         web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

         <br>

         <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d385399.35196998226!2d28.68253566048627!3d41.004851959374285!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14caa7040068086b%3A0xe1ccfe98bc01b0d0!2zxLBzdGFuYnVs!5e0!3m2!1str!2str!4v1789995865813!5m2!1str!2str" 
         width="600" height="450" style="border:0;" allowfullscreen="" 
         loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </div>


    
</body>
</html>
