<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        //Şarj süresi tahmin dk cinsinden motoru mevcutyüzde,hedefyzde,bataryaKw,istasyonKw gece gündüz tarfiesi ekle
        //bataryakw bataryanın alış hızı
        //istasyonkw istasyonun veriş hızı
        //%1 1000kw alabilir

        const sureHesapla = (mevcutYuzde, hedefYuzde, bataryaKw, istasyonKw) => {

            if (hedefYuzde <= mevcutYuzde) {
                return "Hedef yüzde mevcut yüzdeden küçük olamaz"
            }


            let yuzdeFarki = hedefYuzde - mevcutYuzde;
            // %1 = 1000 Wh = 1 kWh
            let gerekliEnerji = yuzdeFarki;
            let sarjHizi = Math.min(istasyonKw, bataryaKw);
            let sureSaat = gerekliEnerji / sarjHizi;
            let sureDakika = sureSaat * 60;

            return sureDakika;

        }

        const tarifeHesapla = (saat) => {

            let geceFiyati = 5;
            let gunduzFiyati = 8;

            if (saat >= 22 || saat < 6) {
                return geceFiyati;
            } else {
                return gunduzFiyati;
            }
        };


        const ucretHesapla = (mevcutYuzde, hedefYuzde, saat) => {

            if (hedefYuzde <= mevcutYuzde) {
                return "Hedef yüzde mevcut yüzdeden küçük olamaz";
            }

            let yuzdeFarki = hedefYuzde - mevcutYuzde;
            let gerekliEnerji = yuzdeFarki;
            let tarife = tarifeHesapla(saat);
            let toplamUcret = gerekliEnerji * tarife;

            return toplamUcret;
        };


        console.log(sureHesapla(20, 80, 20, 30));
        console.log(ucretHesapla(20, 80, 23));

    </script>
</body>

</html>
